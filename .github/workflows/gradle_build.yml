# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release with artifacts'
        required: false
        default: false
        type: boolean

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: dist/
        
    - name: Archive mapping.txt
      uses: actions/upload-artifact@v4
      with:
        name: Mappings
        path: mapping/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: Artifacts
        path: ./artifacts
    
    - name: Download Mappings
      uses: actions/download-artifact@v4
      with:
        name: Mappings
        path: ./mappings
    
    - name: Determine Release Tag
      id: tag
      run: |
        echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Release ${{ steps.tag.outputs.tag }} ${{ steps.tag.outputs.branch }}
        draft: false
        prerelease: false
        files: |
          artifacts/*
          mappings/*
        body: |
          ## Release ${{ steps.tag.outputs.tag }} ${{ steps.tag.outputs.branch }}

          ### Artifacts
          - Built JAR files available in artifacts
          - Mapping files available for debugging
          
          ### Build Information
          - Commit: ${{ github.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
